changelog: |-
  v1.4.0.0
  - YouTube import no longer needs anything installed. The extractor now travels inside the plugin package, so pasting a link works on a stock Jellyfin server; previously the feature reported that yt-dlp was missing and did nothing until it was installed by hand in the container, where it also disappeared on the next Jellyfin update
  - yt-dlp is still supported and is preferred automatically when present, with no configuration, because it is updated continuously against YouTube's changes while a bundled copy only moves when this plugin is released. The settings page reports which of the two is in use
  - Video is assembled from a container-matched video and audio pair rather than one of YouTube's pre-muxed streams, which top out at 360p. The join is a stream copy, so it costs no re-encode: measured at 1080p VP9 in about 5 seconds
  - The plugin package now contains four assemblies instead of one. The build fails if that set ever changes, so a dependency can neither go missing at runtime nor be shipped by accident

  v1.3.1.0
  - The Theme Finder no longer shows a message about yt-dlp. When YouTube import is turned off, or the extractor is not installed, the whole import card is simply not shown, instead of telling whoever opened the page to go install a command-line tool. Whether the extractor was found, and where it was looked for, is still reported on the plugin settings page, right next to the setting that fixes it

  v1.3.0.0
  - The plugin interface is English only. The Italian translation and the interface-language setting in the General tab have been removed; existing configurations keep working and simply ignore the stored value
  - Season names written in Italian are still recognised. "2ª Stagione", "2° Stagione" and "stagione 2" continue to resolve to season 2, because those are library folder names the plugin reads, not interface text
  - Interface: the language machinery is gone from the frontend, so each page ships one string table instead of two and loads slightly less script

  v1.2.0.0
  - YouTube import is now verified end to end and much faster. A source YouTube serves as H.264 used to be re-encoded to VP9 before it could be written, measured at roughly four times realtime — minutes of pegged CPU for one theme. The container the extractor returns is now carried through and the stream simply copied: the same 3.5 minute video went from about 13 minutes to 7 seconds
  - Fix: a theme video that turned out to contain no video track is now rejected instead of being written as a silent, picture-less backdrop
  - Fix: theme videos are recognised in both webm and mp4 everywhere, including the link repair that registers them with Jellyfin — an imported mp4 would previously never have been linked and so never played
  - Fix: two dashboard actions saving at the same time can no longer lose one of the two entries, or fail part-way through writing the configuration file
  - Fix: a later season is no longer confidently given an earlier season's themes. When the episode ranges the source reports do not cleanly divide the run, all themes are offered instead of naming a season that cannot be determined
  - Fix: a single-season show no longer gets the same opening written into both the series folder and its season folder
  - Fix: which song becomes the item's root theme is now deterministic instead of depending on filesystem order, and it is not rewritten when nothing changed
  - Fix: stale theme references are removed from an item instead of accumulating on every volume change and force sync
  - Fix: the skip list, the manual bindings, the resolution cache and the unresolved list are all bounded now, and expired cache entries are swept on a schedule rather than only when something happens to look them up again
  - Fix: cache and unresolved-list reads no longer block a thread each and no longer serialize against one another
  - Fix: a malformed library-name pattern can no longer hang a sync, and an invalid one falls back to a plain text match instead of failing
  - Fix: the themes playlist is written atomically and is removed when no themes remain, instead of leaving a list of paths that no longer exist
  - Fix: ffmpeg runs are now capped across the whole plugin. The previous limit applied only within a single request, so several simultaneous downloads could start an unbounded number of conversions
  - Interface: the two result lists, the log boxes, the poster rendering and the element lookups now share one implementation, and the results list uses a single consistent keyboard model

  v1.1.0.0
  - New: add openings and endings from a YouTube link, for themes animethemes.moe does not have. Pasting a link asks whether it is an OP or an ED and whether you want audio, video or both. Off by default, and it needs yt-dlp installed in the Jellyfin environment
  - Fix: a failed or interrupted conversion no longer leaves a broken theme file that every later sync skipped as "already downloaded". Theme files are now published atomically, and an existing empty one is replaced
  - Fix: deleting an item from the library no longer wipes the theme-music and backdrops folders wholesale. Cleanup now removes only the files this plugin recorded for that item, so shared folders and your own fanart are left alone
  - Fix: a force sync no longer deletes theme files it did not create, including ones added through the Theme Finder
  - Fix: themes whose download failed are kept on the Unresolved list instead of silently disappearing from it
  - Fix: cancelling a sync now leaves a finished status instead of a progress bar frozen at the last percentage
  - Fix: large theme videos are no longer aborted after 30 seconds
  - Fix: one failing provider lookup no longer aborts resolution for every item in the run, and libraries with more than 100 tagged items are no longer partly ignored
  - Fix: the themes playlist now also finds items in nested library folders
  - Fix: the resolution cache and the unresolved list survive an unclean shutdown, and a damaged file is kept aside instead of being silently emptied
  - Fix: sequels and later seasons are no longer confidently matched to the wrong entry ("Season 2" and a bare title are now told apart)
  - Fix: the ♪ button no longer polls the server every 1.5 seconds while a detail page is open
  - Fix: keyboard use in the Theme Finder no longer selects the audio track when activating the preview or video button
  - Fix: downloading themes picked across several seasons now attributes each one to the anime it came from
  - Fix: sync status pollers stop when you leave a plugin page, and closing a preview no longer swallows a later Escape keypress
  - Hardening: theme deletion endpoints now refuse files the plugin never recorded, and the anonymous web-injection endpoint has a size limit

  v1.0.8.0
  - Introduce a unified high-contrast comet-and-music SVG mark across plugin pages, the item action and Jellyfin's dashboard sidebar
  - Replace duplicated inline artwork and the generic sidebar orb with one versioned embedded asset

  v1.0.7.1
  - Increase secondary-text contrast and make accessibility audits deterministic across CI rendering speeds

  v1.0.7.0
  - Shared versioned asset loader with visible failure handling across all Jellyfin page shells
  - Shared accessibility module for keyboard tabs, busy states and live announcements
  - Playwright end-to-end coverage and automated axe WCAG A/AA audits in CI
  - Complete language-specific English and Italian documentation with official support and repository buttons

  v1.0.0.7
  - Interface language (English / Italian, in the General tab) now switches the whole dashboard instantly when you pick it, instead of only after saving and reopening the page

  v1.0.0.6
  - Unresolved tab: each row now has a "Search & bind" button that opens the Theme Finder for that anime so you can search and attach themes manually
  - Clearer settings: the old "Library" tab is now "Excluded" (just the blacklist, with plainer wording) and the themes playlist moved into the "Themes & Download" tab with a short explanation of what Refresh / Export M3U do

  v1.0.0.5
  - Theme Finder: selections now persist when you switch between results, so you can pick OP/ED/video across different seasons (which appear as separate animethemes.moe entries) and download them all to one item
  - New selection review panel listing every picked theme grouped by anime, each removable; each search result shows a badge with how many themes you picked from it
  - After a partial download, only the failed items stay selected (ready to retry) instead of clearing everything

  v1.0.0.4
  - Donate buttons now use the official Buy Me a Coffee and PayPal Donate buttons

  v1.0.0.3
  - Added Buy Me a Coffee and PayPal donate buttons to the plugin pages, README and the GitHub Sponsor button

  v1.0.0.2
  - Fix: the provider priority list no longer grows with duplicate entries on every save/restart (the saved list is now deduplicated and repaired automatically on load)
  - The "KometaThemes" entry in the dashboard Plugins sidebar now shows the brand planet icon instead of the generic folder, and a cleaner "KometaThemes" label

  v1.0.0.1
  - Fix: the ♪ Theme Finder button is now injected correctly when other web-mod plugins (Jellyfin Enhanced, KefinTweaks, JavaScript Injector, …) are installed — the File Transformation registration now joins the shared "index.html" pipeline instead of a separate one that never ran

  v1.0.0.0
  - Automatic anime OP/ED theme download from animethemes.moe (audio + video)
  - Multi-provider matching (AniDB, AniList, MyAnimeList, Kitsu, AniSearch) with title fallback
  - Multi-season detection and AllPerSeason fetch
  - Theme Finder: guided search with audio/video preview, reachable from a ♪ button on item pages (auto-injected via the File Transformation plugin)
  - Unresolved tab: items that failed to match or download, with per-item Retry and Blacklist
  - Activity log showing the plugin's Jellyfin server-log entries; live sync indicator
  - One-click theme link repair for the Jellyfin 10.11.x playback bug
  - Persistent resolution cache, rate limiting, parallel downloads, global M3U playlist, EN/IT UI
